<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RVP Preview Runner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #0f172a;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        padding: 28px;
        min-height: 100%;
        box-sizing: border-box;
      }
      button {
        cursor: pointer;
      }
      /* Render-highlight flash injected by the instrumented runtime */
      .rvp-flash {
        outline: 2px solid #22d3ee !important;
        outline-offset: 2px;
        border-radius: 4px;
        animation: rvp-flash-fade 0.6s ease-out forwards;
      }
      @keyframes rvp-flash-fade {
        0% {
          outline-color: #22d3ee;
          background-color: rgba(34, 211, 238, 0.18);
        }
        100% {
          outline-color: rgba(34, 211, 238, 0);
          background-color: transparent;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview/runner-main.ts"></script>
  </body>
</html>
